<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Mduduzi Abdul Mahlangu" />
    <meta
      name="description"
      content="Business directory page for Mamelodi West Chamber of Commerce."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <meta
      property="og:title"
      content="Mamelodi West Chamber of Commerce Directory page"
    />
    <meta
      property="og:description"
      content="Discover local businesses in our community."
    />
    <meta
      property="og:image"
      content="https://abdulmahl.github.io/wdd231/chamber/images/chamber-share.png"
    />
    <meta
      property="og:url"
      content="https://abdulmahl.github.io/wdd231/chamber/directory.html"
    />
    <link rel="stylesheet" href="styles/normalize.css" />
    <link rel="stylesheet" href="styles/small.css" />
    <link rel="stylesheet" href="styles/larger.css" />
    <link rel="icon" href="images/favicon.ico" />
    <title>Chamber of Commerce Directory</title>
    <script src="scripts/directory.js" defer></script>
  </head>
  <body>
    <div class="site-header">
      <header>
        <a href="#">
          <img src="images/logo_light.svg" alt="Site Logo" />
        </a>
        <button
          class="theme-button-small theme-toggle"
          aria-label="Toggle dark mode"
        >
          &#9728;
        </button>
        <button
          type="button"
          id="ham-btn"
          class="hamburger"
          aria-label="Open Navigation"
        >
          <span class="button-shoosher">Hello</span>
        </button>
      </header>
      <nav id="menuItems">
        <ul>
          <li><a href="" class="">Home</a></li>
          <li><a href="" class="active">Directory</a></li>
          <li><a href="" class="">Join</a></li>
          <li><a href="" class="">Discover</a></li>
        </ul>
        <button
          class="theme-button-large theme-toggle"
          aria-label="Toggle dark mode"
        >
          &#9728;
        </button>
      </nav>
    </div>

    <main>
      <div class="dir-heading">
        <h1>Directory</h1>
        <div id="viewBtns" class="view-buttons">
          <button type="button" id="grid-view-btn">Grid</button>
          <button type="button" id="list-view-btn">List</button>
        </div>
      </div>
      <div id="members" class="business-members"></div>
    </main>
    <footer>
      <div class="footer-content">
        <div class="footer-info">
          <p class="footer-title">Mamelodi West Chamber</p>
          <p>3338 Louis Mkhwebane</p>
          <p>Mamelodi, Pretoria 0122</p>
          <p>
            <a href="mailto:info@mamschamber.co.za">info@mamschamber.co.za</a>
          </p>
          <p><a href="tel:2235552300">(012) 555-2300</a></p>
        </div>

        <div class="footer-socials">
          <a
            href="https://www.youtube.com/@_abdulmahl"
            target="_blank"
            rel="noopener"
            aria-label="YouTube"
          >
            <img
              src="images/footer-icons/youtube-svgrepo-com.svg"
              alt="YouTube Icon"
              class="social-icon"
            />
          </a>
          <a
            href="https://github.com/abdulmahl"
            target="_blank"
            rel="noopener"
            aria-label="GitHub"
          >
            <img
              src="images/footer-icons/github-svgrepo-com.svg"
              alt="GitHub Icon"
              class="social-icon"
            />
          </a>
          <a
            href="https://www.linkedin.com/in/abdul-mahlangu/"
            target="_blank"
            rel="noopener"
            aria-label="LinkedIn"
          >
            <img
              src="images/footer-icons/linkedin-svgrepo-com.svg"
              alt="LinkedIn Icon"
              class="social-icon"
            />
          </a>
        </div>

        <div class="footer-details">
          <p>WDD231</p>
          <p>Mduduzi Abdul</p>
          <p>&copy; <span id="currentyear"></span> Mamelodi West Chamber</p>
          <p id="lastModified"></p>
        </div>
      </div>
    </footer>
  </body>
</html>
