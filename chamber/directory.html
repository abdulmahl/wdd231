<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Mduduzi Abdul" />
    <meta
      name="description"
      content="Business directory page for local chamber of commerce."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <meta property="og:title" content="Chamber of Commerce Directory" />
    <meta
      property="og:description"
      content="Discover local businesses in our community."
    />
    <meta
      property="og:image"
      content="https://abdulmahl.github.io/wdd231/chamber/images/chamber-share.png"
    />
    <meta
      property="og:url"
      content="https://abdulmahl.github.io/wdd231/chamber/directory.html"
    />
    <link rel="stylesheet" href="styles/normalize.css" />
    <link rel="stylesheet" href="styles/small.css" />
    <link rel="stylesheet" href="styles/larger.css" />
    <link rel="icon" href="images/favicon.ico" />
    <title>Chamber of Commerce Directory</title>
    <script src="scripts/directory.js" defer></script>
  </head>
  <body>
    <div class="site-header">
      <header>
        <img src="images/logo_light.svg" alt="Site Logo" />
        <button
          id="theme-toggle"
          class="theme-button-small"
          aria-label="Toggle dark mode"
        >
          &#9728;
        </button>
        <button
          type="button"
          id="ham-btn"
          class="hamburger"
          aria-label="Open Navigation"
        >
          <span class="button-shoosher">Hello</span>
        </button>
      </header>
      <nav id="menuItems">
        <ul>
          <li><a  href="" class="active">Home</a></li>
          <li><a  href="" class="">Directory</a></li>
          <li><a  href="" class="">Join</a></li>
          <li><a  href="" class="">Discover</a></li>
        </ul>
        <button
          id="theme-toggle"
          class="theme-button-large"
          aria-label="Toggle dark mode"
        >
          &#9728;
        </button>
      </nav>
    </div>

    <main>
      <div class="dir-heading">
        <h1>Directory</h1>
        <div id="viewBtns" class="view-buttons">
          <button type="button">Grid</button>
          <button type="button">List</button>
        </div>
      </div>

      <div id="members" class="business-members"></div>
    </main>
    <footer></footer>
  </body>
</html>
